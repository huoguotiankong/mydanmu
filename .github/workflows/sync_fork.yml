name: Safe Upstream Sync

on:
  schedule:
    # 11:23 Beijing time (03:23 UTC), daily
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Test upstream before updating main
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch --no-tags upstream main

      - name: Merge upstream without committing
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not discard fork-specific commits. A conflict stops this workflow.
          git merge --no-commit --no-ff upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm install --no-audit --no-fund

      - name: Run upstream tests
        if: steps.merge.outputs.changed == 'true'
        run: npm test

      - name: Commit tested upstream changes
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "chore: sync tested upstream main"
          # Abort rather than overwrite concurrent changes on main.
          git push origin HEAD:main
